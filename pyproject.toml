[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codegreen"
version = "0.3.2"
description = "Energy-aware software development tool for measuring and optimizing code energy consumption"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Saurabhsingh Rajput", email = "saurabh@dal.ca"}
]
maintainers = [
    {name = "Saurabhsingh Rajput", email = "saurabh@dal.ca"}
]
keywords = [
    "energy", "measurement", "optimization", "profiling", "green-computing",
    "sustainability", "power", "performance", "analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Environment :: Console"
]
requires-python = ">=3.8"
dependencies = [
    "typer>=0.17.0",
    "rich>=12.0.0",
    "pydantic>=1.10.0",
    "psutil>=5.9.0",
    "packaging>=21.0",
    "markdown-it-py>=3.0.0,<4.0.0",
    "tree-sitter-language-pack"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0"
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0"
]
viz = [
    "matplotlib>=3.5.0",
    "pandas>=1.4.0",
    "plotly>=5.10.0"
]

[project.urls]
Homepage = "https://smart-dal.github.io/codegreen/"
Documentation = "https://smart-dal.github.io/codegreen/"
Repository = "https://github.com/SMART-Dal/codegreen"
"Bug Tracker" = "https://github.com/SMART-Dal/codegreen/issues"

[project.scripts]
codegreen = "codegreen.cli.entrypoint:main_cli_wrapper"

# Setuptools configuration
# NOTE: setup.py handles the actual build (cmake for C++ NEMB backend).
# This section tells setuptools which Python packages to include in the wheel.
# The C++ binary (lib/libcodegreen-nemb.so, bin/codegreen) is copied into the
# wheel by setup.py's BuildWithCMake command.
[tool.setuptools.packages]
find = {where = ["."], include = [
    "codegreen", "codegreen.cli", "codegreen.analyzer", "codegreen.instrumentation", "codegreen.utils",
    "codegreen.analysis", "codegreen.analysis.cfg",
    "benchmark", "benchmark.validation", "benchmark.suites",
]}

[tool.setuptools.package-data]
"codegreen.instrumentation" = [
    "configs/*.json",
    "language_runtimes/python/*.py",
    "language_runtimes/c/*.h",
    "language_runtimes/cpp/*.h",
    "language_runtimes/cpp/*.hpp",
    "language_runtimes/cpp/**/*.hpp",
    "language_runtimes/java/**/*.java",
]
# Native binaries are copied by setup.py BuildWithCMake, but we also
# declare them here so setuptools knows the wheel is platform-specific.
"codegreen" = [
    "config.json",
    "lib/*.so",
    "lib/*.dylib",
    "lib/*.dll",
    "lib/runtime/**/*.h",
    "bin/codegreen",
    "bin/codegreen.exe",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.a", "*.o", "*.pyc"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=codegreen"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["codegreen"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]