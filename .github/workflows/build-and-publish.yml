name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]  # Linux-only (RAPL requires Linux kernel)

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install cibuildwheel
      run: pip install cibuildwheel==2.22.0

    - name: Build wheels
      run: cibuildwheel --output-dir wheelhouse
      env:
        # Build for manylinux x86_64 only (RAPL = Linux + x86/AMD64)
        CIBW_BUILD: "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
        CIBW_SKIP: "*-musllinux*"
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        # Install build deps inside container
        CIBW_BEFORE_ALL_LINUX: >
          yum install -y epel-release &&
          yum install -y cmake gcc-c++ make pkgconfig jsoncpp-devel libcurl-devel sqlite-devel &&
          git submodule update --init --recursive
        # Build C++ and set RPATH so .so is found at runtime
        CIBW_BEFORE_BUILD: >
          cd {project} &&
          mkdir -p build && cd build &&
          cmake .. -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=$(which python) &&
          cmake --build . --config Release -j$(nproc)
        CIBW_ENVIRONMENT: >
          LD_LIBRARY_PATH={project}/lib:$LD_LIBRARY_PATH
        # Smoke test
        CIBW_TEST_COMMAND: >
          python -c "from src.cli.cli import get_binary_path; print('binary:', get_binary_path())" &&
          codegreen --help

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install build
    - run: python -m build --sdist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  test-wheel:
    name: Test wheel installation
    needs: build-wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/download-artifact@v4
      with:
        name: wheels-ubuntu-22.04
        path: wheelhouse/
    - name: Install and test
      run: |
        pip install wheelhouse/*cp$(echo ${{ matrix.python-version }} | tr -d '.')*manylinux*.whl
        codegreen --help
        codegreen doctor || true
        echo 'print(sum(range(100000)))' > test.py
        codegreen measure python test.py --json || true

  publish-testpypi:
    name: Publish to Test PyPI
    needs: [build-wheels, build-sdist, test-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: test-pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist/
    - run: |
        mkdir -p final_dist
        find dist/ -name "*.whl" -o -name "*.tar.gz" | xargs -I{} cp {} final_dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: final_dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (no API tokens needed)
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist/
    - run: |
        mkdir -p final_dist
        find dist/ -name "*.whl" -o -name "*.tar.gz" | xargs -I{} cp {} final_dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: final_dist/
