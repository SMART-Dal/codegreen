name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install cibuildwheel
      run: pip install cibuildwheel==2.22.0

    - name: Build wheels (Linux)
      if: matrix.platform == 'linux'
      run: cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
        CIBW_SKIP: "*-musllinux*"
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_BEFORE_ALL_LINUX: >
          yum install -y epel-release &&
          yum install -y cmake gcc-c++ make pkgconfig jsoncpp-devel libcurl-devel sqlite-devel &&
          git submodule update --init --recursive
        CIBW_BEFORE_BUILD: >
          cd {project} && mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_RPATH=\$ORIGIN/../lib -DPython3_EXECUTABLE=$(which python) && cmake --build . --config Release -j$(nproc) && ls -la {project}/lib/libcodegreen-nemb.so {project}/build/bin/codegreen 2>/dev/null
        CIBW_ENVIRONMENT: >
          LD_LIBRARY_PATH={project}/lib:$LD_LIBRARY_PATH
        CIBW_TEST_COMMAND: >
          python -c "import importlib,pathlib;pkg=pathlib.Path(importlib.import_module('codegreen').__file__).parent;so=pkg/'lib'/'libcodegreen-nemb.so';b=pkg/'bin'/'codegreen';assert so.exists(),f'NEMB .so missing at {so}';assert b.exists(),f'CLI missing at {b}';print(f'NEMB OK: {so} ({so.stat().st_size}B)');print(f'CLI OK: {b} ({b.stat().st_size}B)')" && codegreen --help

    - name: Build wheels (macOS)
      if: matrix.platform == 'macos'
      run: cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: "cp310-macosx_arm64 cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64"
        CIBW_ARCHS_MACOS: arm64
        CIBW_BEFORE_ALL_MACOS: >
          brew install cmake pkg-config jsoncpp curl sqlite &&
          git submodule update --init --recursive
        CIBW_BEFORE_BUILD: >
          cd {project} && mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_RPATH=@loader_path/../lib -DPython3_EXECUTABLE=$(which python) && cmake --build . --config Release -j$(sysctl -n hw.ncpu) && ls -la {project}/lib/libcodegreen-nemb.dylib {project}/build/bin/codegreen
        CIBW_TEST_COMMAND: >
          python -c "import importlib,pathlib;pkg=pathlib.Path(importlib.import_module('codegreen').__file__).parent;print(f'dylib={(pkg/\"lib\"/\"libcodegreen-nemb.dylib\").exists()}')" && codegreen --help && codegreen doctor || true

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install build
    - run: python -m build --sdist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  test-linux-wheel:
    name: Test Linux wheel (${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/download-artifact@v4
      with:
        name: wheels-ubuntu-22.04
        path: wheelhouse/
    - name: Install and test
      run: |
        pip install wheelhouse/*cp$(echo ${{ matrix.python-version }} | tr -d '.')*manylinux*.whl

        codegreen --help

        python -c "
        import importlib, pathlib
        pkg = pathlib.Path(importlib.import_module('codegreen').__file__).parent
        so = pkg / 'lib' / 'libcodegreen-nemb.so'
        binary = pkg / 'bin' / 'codegreen'
        assert so.exists(), f'NEMB .so missing at {so}'
        assert binary.exists(), f'CLI binary missing at {binary}'
        print(f'NEMB: {so} ({so.stat().st_size} bytes)')
        print(f'CLI:  {binary} ({binary.stat().st_size} bytes)')
        "

        cat > /tmp/cg_test.py << 'PYEOF'
        def fibonacci(n):
            if n <= 1: return n
            return fibonacci(n-1) + fibonacci(n-2)
        def main():
            fibonacci(10)
        if __name__ == "__main__":
            main()
        PYEOF
        codegreen analyze python /tmp/cg_test.py --json | python -c "
        import json, sys
        d = json.load(sys.stdin)
        pts = d.get('instrumentation_points', [])
        assert len(pts) >= 2, f'Expected >= 2 instrumentation points, got {len(pts)}'
        print(f'Instrumentation: {len(pts)} points found')
        "

        python -c "
        import json, pathlib, importlib
        pkg = pathlib.Path(importlib.import_module('codegreen.instrumentation').__file__).parent
        configs = list((pkg / 'configs').glob('*.json'))
        assert len(configs) >= 4, f'Expected >= 4 language configs, got {len(configs)}'
        for c in configs:
            d = json.loads(c.read_text())
            assert 'ast_config' in d, f'{c.name}: missing ast_config'
        print(f'Configs: {len(configs)} language configs valid')
        "

        codegreen doctor || true

  test-macos-wheel:
    name: Test macOS wheel (${{ matrix.python-version }})
    needs: build-wheels
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/download-artifact@v4
      with:
        name: wheels-macos-latest
        path: wheelhouse/
    - name: Install and test
      run: |
        pip install wheelhouse/*cp$(echo ${{ matrix.python-version }} | tr -d '.')*macosx*.whl || pip install wheelhouse/*.whl

        codegreen --version
        codegreen --help

        echo 'def f(n): return f(n-1) if n > 0 else 0' > /tmp/t.py
        codegreen analyze python /tmp/t.py --json | python -c "
        import json, sys
        d = json.load(sys.stdin)
        pts = d.get('instrumentation_points', [])
        print(f'Instrumentation: {len(pts)} points on macOS ARM64')
        assert len(pts) >= 1
        "

        python -c "
        import platform, importlib, pathlib
        print(f'Platform: {platform.machine()} / {platform.system()}')
        pkg = pathlib.Path(importlib.import_module('codegreen').__file__).parent
        dylib = pkg / 'lib' / 'libcodegreen-nemb.dylib'
        if dylib.exists():
            print(f'NEMB: {dylib} ({dylib.stat().st_size} bytes)')
        else:
            print('NEMB: not built (Python-only wheel)')
        "

        codegreen doctor || true

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-linux-wheel, test-macos-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist/
    - run: |
        mkdir -p final_dist
        find dist/ -name "*.whl" -o -name "*.tar.gz" | xargs -I{} cp {} final_dist/
        echo "=== Artifacts to publish ==="
        ls -la final_dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: final_dist/

  create-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        gh release create "$TAG" --title "$TAG" --latest --generate-notes
