name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]  # Linux-only (RAPL requires Linux kernel)

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install cibuildwheel
      run: pip install cibuildwheel==2.22.0

    - name: Build wheels
      run: cibuildwheel --output-dir wheelhouse
      env:
        # Build for manylinux x86_64 only (RAPL = Linux + x86/AMD64)
        CIBW_BUILD: "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
        CIBW_SKIP: "*-musllinux*"
        CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/pypa/manylinux_2_28_x86_64
        # Install C++ build deps inside manylinux container
        CIBW_BEFORE_ALL_LINUX: >
          yum install -y epel-release &&
          yum install -y cmake gcc-c++ make pkgconfig jsoncpp-devel libcurl-devel sqlite-devel &&
          git submodule update --init --recursive
        # Build C++ NEMB backend before wheel packaging
        CIBW_BEFORE_BUILD: >
          cd {project} &&
          mkdir -p build && cd build &&
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_RPATH=\$ORIGIN/../lib -DPython3_EXECUTABLE=$(which python) &&
          cmake --build . --config Release -j$(nproc) &&
          echo "=== NEMB build artifacts ===" &&
          ls -la {project}/lib/libcodegreen-nemb.so {project}/build/bin/codegreen 2>/dev/null
        CIBW_ENVIRONMENT: >
          LD_LIBRARY_PATH={project}/lib:$LD_LIBRARY_PATH
        # Thorough smoke test: verify binary exists, loads, and CLI works
        CIBW_TEST_COMMAND: >
          python -c "
          import importlib, pathlib, sys;
          pkg = pathlib.Path(importlib.import_module('src').__file__).parent;
          so = pkg / 'lib' / 'libcodegreen-nemb.so';
          binary = pkg / 'bin' / 'codegreen';
          assert so.exists(), f'NEMB .so not found at {so}';
          assert binary.exists(), f'codegreen binary not found at {binary}';
          print(f'NEMB binary OK: {so} ({so.stat().st_size} bytes)');
          print(f'CLI binary OK: {binary} ({binary.stat().st_size} bytes)');
          " &&
          codegreen --help &&
          codegreen analyze python -c "print('hello')" --json 2>/dev/null || true

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install build
    - run: python -m build --sdist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  test-wheel:
    name: Test wheel installation
    needs: build-wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/download-artifact@v4
      with:
        name: wheels-ubuntu-22.04
        path: wheelhouse/
    - name: Install and test
      run: |
        pip install wheelhouse/*cp$(echo ${{ matrix.python-version }} | tr -d '.')*manylinux*.whl

        # 1. Verify CLI works
        codegreen --help

        # 2. Verify NEMB binary is in the installed package
        python -c "
        import importlib, pathlib
        pkg = pathlib.Path(importlib.import_module('src').__file__).parent
        so = pkg / 'lib' / 'libcodegreen-nemb.so'
        binary = pkg / 'bin' / 'codegreen'
        assert so.exists(), f'NEMB .so missing at {so}'
        assert binary.exists(), f'CLI binary missing at {binary}'
        print(f'NEMB: {so} ({so.stat().st_size} bytes)')
        print(f'CLI:  {binary} ({binary.stat().st_size} bytes)')
        "

        # 3. Verify instrumentation works (no execution, no RAPL needed)
        cat > /tmp/cg_test.py << 'PYEOF'
        def fibonacci(n):
            if n <= 1: return n
            return fibonacci(n-1) + fibonacci(n-2)
        def main():
            fibonacci(10)
        if __name__ == "__main__":
            main()
        PYEOF
        codegreen analyze python /tmp/cg_test.py --json | python -c "
        import json, sys
        d = json.load(sys.stdin)
        pts = d.get('instrumentation_points', [])
        assert len(pts) >= 2, f'Expected >= 2 instrumentation points, got {len(pts)}'
        print(f'Instrumentation: {len(pts)} points found')
        "

        # 4. Verify all language configs load
        python -c "
        import json, pathlib, importlib
        pkg = pathlib.Path(importlib.import_module('src.instrumentation').__file__).parent
        configs = list((pkg / 'configs').glob('*.json'))
        assert len(configs) >= 4, f'Expected >= 4 language configs, got {len(configs)}'
        for c in configs:
            d = json.loads(c.read_text())
            assert 'ast_config' in d, f'{c.name}: missing ast_config'
        print(f'Configs: {len(configs)} language configs valid')
        "

        # 5. Verify doctor reports system status
        codegreen doctor || true

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist/
    - run: |
        mkdir -p final_dist
        find dist/ -name "*.whl" -o -name "*.tar.gz" | xargs -I{} cp {} final_dist/
        echo "=== Artifacts to publish ==="
        ls -la final_dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: final_dist/
